name: Deploy to GitHub Pages

# Build the Vite client and publish dist/ to GitHub Pages on every push to main.
# The game "servers" are peer-to-peer host sessions that run in players' browsers
# (via PeerJS), so there is nothing server-side to deploy here — Pages only serves
# the static client, and sessions keep working unchanged.
#
# This repo enforces "actions must be pinned to a full-length commit SHA", so every
# `uses:` below is pinned to a SHA (the version tag is kept in a trailing comment).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # Use `npm install` (not `npm ci`): the committed lockfile was generated on
      # Windows and can omit the Linux-only rollup/esbuild native binaries, which
      # would break `npm ci` on the Ubuntu runner. install re-resolves them.
      - name: Install dependencies
        run: npm install

      # TURN credentials come from repo secrets. If unset, the build falls back
      # to STUN-only (direct P2P). NOTE: VITE_* values are inlined into the public
      # bundle and are readable by anyone — prefer short-lived TURN credentials.
      - name: Build
        run: npm run build
        env:
          # Custom PeerJS signaling server (optional). Unset secrets resolve to
          # empty strings, which the client treats as "use the public cloud broker".
          VITE_PEER_HOST: ${{ secrets.VITE_PEER_HOST }}
          VITE_PEER_PORT: ${{ secrets.VITE_PEER_PORT }}
          VITE_PEER_PATH: ${{ secrets.VITE_PEER_PATH }}
          VITE_PEER_KEY: ${{ secrets.VITE_PEER_KEY }}
          VITE_PEER_SECURE: ${{ secrets.VITE_PEER_SECURE }}
          # TURN relay (optional). STUN-only direct P2P is the default when unset.
          VITE_TURN_URLS: ${{ secrets.VITE_TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
          VITE_ICE_RELAY_ONLY: ${{ secrets.VITE_ICE_RELAY_ONLY }}

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
