name: Deploy to GitHub Pages

# Build the Vite client and publish dist/ to GitHub Pages on every push to main.
# The game "servers" are peer-to-peer host sessions that run in players' browsers
# (via PeerJS), so there is nothing server-side to deploy here — Pages only serves
# the static client, and sessions keep working unchanged.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Use `npm install` (not `npm ci`): the committed lockfile was generated on
      # Windows and can omit the Linux-only rollup/esbuild native binaries, which
      # would break `npm ci` on the Ubuntu runner. install re-resolves them.
      - name: Install dependencies
        run: npm install

      # TURN credentials come from repo secrets. If unset, the build falls back
      # to STUN-only (direct P2P). NOTE: VITE_* values are inlined into the public
      # bundle and are readable by anyone — prefer short-lived TURN credentials.
      - name: Build
        run: npm run build
        env:
          VITE_TURN_URLS: ${{ secrets.VITE_TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
          VITE_ICE_RELAY_ONLY: ${{ secrets.VITE_ICE_RELAY_ONLY }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
